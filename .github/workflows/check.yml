name: Checks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m compileall -q src scripts
